name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check public snapshot
        run: python3 tools/verify_integrity.py --full
      - name: Test recovered boot, NGame and native ABI (no private firmware)
        run: make -C research/boot_reconstruction test
      - name: Test media loader and MMPi traversal (synthetic public fixtures)
        run: |
          python3 -m unittest discover -s research/Stage56_MediaLoader/tests -v
          python3 -m unittest discover -s research/Stage57_CevaAbi/tests -v
          make -C project/spmp-os/features/multimedia/codec_lab check
      - name: Build host prototype
        run: make -C project/spmp-os host
      - name: Test measured MMI input and shell navigation
        run: make -C project/spmp-os mmi-input-check
      - name: Test file manager integration, direct TrueType and callback forwarding
        run: |
          make -C project/spmp-os mmi-files-check ttf-check build/stage15_router_harness build/atari_harness
          (cd project/spmp-os && ./build/stage15_router_harness && ./build/atari_harness)
      - name: Host registry smoke check
        working-directory: project/spmp-os
        run: ./build/spmp-os-host --cores
      - name: Copy engine with real temporary files, verification and cancellation
        run: make -C project/spmp-os file-copy-check file-copy-sanitize-check
      - name: Install ARM build tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld python3-venv
      - name: Check reconstructed declarations for ARMv5TE soft-float
        run: clang --target=arm-none-eabi -march=armv5te -mfloat-abi=soft -std=c11 -ffreestanding -Wall -Wextra -Werror -fsyntax-only -x c research/boot_reconstruction/src/mmi_native_abi.h research/boot_reconstruction/src/mmi_native_resources_abi.h
      - name: Compile portable probe and typed adapter as ARMv5TE objects
        run: make -C research/boot_reconstruction arm-probe
      - name: Save research probe objects and host frame
        uses: actions/upload-artifact@v4
        with:
          name: native-probe-armv5-objects
          retention-days: 14
          path: |
            research/boot_reconstruction/build/native_probe_armv5.o
            research/boot_reconstruction/build/native_probe_adapter_armv5.o
            research/boot_reconstruction/build/native_probe_frame.ppm
      - name: Install isolated ARM VM dependency
        run: |
          python3 -m venv /tmp/spmp-startup-vm
          /tmp/spmp-startup-vm/bin/pip install -r research/boot_reconstruction/requirements-emulation.txt
      - name: Link and execute research startup on ARM926 VM
        run: make -C research/boot_reconstruction arm-startup-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Execute copy engine and FM02 bridge as compiled ARM926 code
        run: make -C project/spmp-os file-copy-arm-check COPY_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save copy engine analysis proof (not a console application)
        uses: actions/upload-artifact@v4
        with:
          name: spmp-file-copy-arm-analysis
          retention-days: 14
          path: |
            project/spmp-os/build/file_copy_host.json
            project/spmp-os/build/file_copy_sanitizers.json
            project/spmp-os/build/file_copy_arm/copy.elf
            project/spmp-os/build/file_copy_arm/copy.map
            project/spmp-os/build/file_copy_arm/copy_vm.json
      - name: Save analysis startup ELFs and validation traces
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-armv5-analysis
          retention-days: 14
          path: |
            research/boot_reconstruction/build/native_startup/*.elf
            research/boot_reconstruction/build/native_startup/*.map
            research/boot_reconstruction/build/native_startup/*.json
            research/boot_reconstruction/build/native_startup/compiler.txt
            research/boot_reconstruction/build/native_startup/linker.txt
            research/boot_reconstruction/examples/native_startup/README_RU.md
      - name: Build NGame probe and verify native binding in public ARM VM
        run: make -C research/boot_reconstruction arm-native-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save experimental RAM application and source-built ELF
        uses: actions/upload-artifact@v4
        with:
          name: native-probe-ngame-vm-tested
          retention-days: 14
          path: |
            research/boot_reconstruction/build/native_startup/SPMP_PROBE_VM.bin
            research/boot_reconstruction/build/native_startup/native.elf
            research/boot_reconstruction/build/native_startup/native.map
            research/boot_reconstruction/build/native_startup/native_layout.json
            research/boot_reconstruction/build/native_startup/native_package.json
            research/boot_reconstruction/build/native_startup/native_binding_vm.json
            research/boot_reconstruction/examples/native_startup/NGAME_README_RU.md
      - name: Build interactive input logger and run ARM/virtual-SD checks
        run: make -C research/boot_reconstruction arm-input-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save input test NGame and log decoder
        uses: actions/upload-artifact@v4
        with:
          name: spmp-input-sd0-vm-tested
          retention-days: 14
          path: |
            research/boot_reconstruction/build/input_test/SPMP_INPUT_SD0.bin
            research/boot_reconstruction/build/input_test/input.elf
            research/boot_reconstruction/build/input_test/input.map
            research/boot_reconstruction/build/input_test/input_package.json
            research/boot_reconstruction/build/input_test/input_vm.json
            research/boot_reconstruction/build/input_test/input_preview.ppm
            research/boot_reconstruction/build/input_test/example.csv
            research/boot_reconstruction/build/input_test/example_decoded.json
            research/boot_reconstruction/examples/input_test/README_RU.md
            research/boot_reconstruction/examples/input_test/preview.png
            research/boot_reconstruction/tools/input_log_decode.py
      - name: Build raw input observer and verify ARM RAM snapshots
        run: make -C research/boot_reconstruction arm-raw-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save raw key test package and decoder
        uses: actions/upload-artifact@v4
        with:
          name: spmp-keys-raw-vm-tested
          retention-days: 14
          path: |
            research/boot_reconstruction/build/raw_input/SPMP_KEYS_RAW.bin
            research/boot_reconstruction/build/raw_input/raw.elf
            research/boot_reconstruction/build/raw_input/raw.map
            research/boot_reconstruction/build/raw_input/raw_package.json
            research/boot_reconstruction/build/raw_input/raw_vm.json
            research/boot_reconstruction/build/raw_input/preview.ppm
            research/boot_reconstruction/build/raw_input/example.csv
            research/boot_reconstruction/build/raw_input/example_decoded.json
            research/boot_reconstruction/examples/raw_input/README_RU.md
            research/boot_reconstruction/examples/raw_input/preview.png
            research/boot_reconstruction/tools/raw_log_decode.py
      - name: Build minimal MMI shell and run ARM input/menu/SD checks
        run: make -C research/boot_reconstruction arm-shell-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save minimal SPMP-OS RAM shell
        uses: actions/upload-artifact@v4
        with:
          name: spmp-os-mini-vm-tested
          retention-days: 14
          path: |
            research/boot_reconstruction/build/mmi_shell/SPMP_OS_MINI.bin
            research/boot_reconstruction/build/mmi_shell/shell.elf
            research/boot_reconstruction/build/mmi_shell/shell.map
            research/boot_reconstruction/build/mmi_shell/shell_package.json
            research/boot_reconstruction/build/mmi_shell/shell_vm.json
            research/boot_reconstruction/build/mmi_shell/preview.ppm
            research/boot_reconstruction/build/mmi_shell/example.csv
            research/boot_reconstruction/examples/mmi_shell/README_RU.md
            research/boot_reconstruction/examples/mmi_shell/preview.png
      - name: File manager component checks
        run: |
          for n in 01 02 03 04 05; do
            (cd project/spmp-os/features/filemanager/FM$n && sh tools/build.sh)
          done
      - name: Build SPMP-OS file manager with direct Roboto TTF and virtual SD checks
        run: make -C research/boot_reconstruction arm-files-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Compile external-ROM Atari adapter for ARMv5
        run: make -C project/spmp-os arm-atari
      - name: Save SPMP-OS file manager and SD folder package
        uses: actions/upload-artifact@v4
        with:
          name: spmp-os-files-vm-tested
          retention-days: 14
          path: |
            research/boot_reconstruction/build/mmi_files/SPMP-OS-SD.zip
            research/boot_reconstruction/build/mmi_files/SPMP_OS_FILES.bin
            research/boot_reconstruction/build/mmi_files/files.elf
            research/boot_reconstruction/build/mmi_files/files.map
            research/boot_reconstruction/build/mmi_files/files_package.json
            research/boot_reconstruction/build/mmi_files/files_vm.json
            research/boot_reconstruction/build/mmi_files/preview.ppm
            research/boot_reconstruction/build/mmi_files/example.csv
            research/boot_reconstruction/examples/mmi_files/README_RU.md
            research/boot_reconstruction/examples/mmi_files/preview.png
