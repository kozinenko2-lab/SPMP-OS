name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check public snapshot
        run: python3 tools/verify_integrity.py --full
      - name: Test recovered boot, NGame and native ABI (no private firmware)
        run: make -C research/boot_reconstruction test
      - name: Build host prototype
        run: make -C project/spmp-os host
      - name: Host registry smoke check
        working-directory: project/spmp-os
        run: ./build/spmp-os-host --cores
      - name: Install ARM build tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld python3-venv
      - name: Check reconstructed declarations for ARMv5TE soft-float
        run: clang --target=arm-none-eabi -march=armv5te -mfloat-abi=soft -std=c11 -ffreestanding -Wall -Wextra -Werror -fsyntax-only -x c research/boot_reconstruction/src/mmi_native_abi.h research/boot_reconstruction/src/mmi_native_resources_abi.h
      - name: Compile portable probe and typed adapter as ARMv5TE objects
        run: make -C research/boot_reconstruction arm-probe
      - name: Save research probe objects and host frame
        uses: actions/upload-artifact@v4
        with:
          name: native-probe-armv5-objects
          retention-days: 14
          path: |
            research/boot_reconstruction/build/native_probe_armv5.o
            research/boot_reconstruction/build/native_probe_adapter_armv5.o
            research/boot_reconstruction/build/native_probe_frame.ppm
      - name: Install isolated ARM VM dependency
        run: |
          python3 -m venv /tmp/spmp-startup-vm
          /tmp/spmp-startup-vm/bin/pip install -r research/boot_reconstruction/requirements-emulation.txt
      - name: Link and execute research startup on ARM926 VM
        run: make -C research/boot_reconstruction arm-startup-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save analysis startup ELFs and validation traces
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-armv5-analysis
          retention-days: 14
          path: |
            research/boot_reconstruction/build/native_startup/*.elf
            research/boot_reconstruction/build/native_startup/*.map
            research/boot_reconstruction/build/native_startup/*.json
            research/boot_reconstruction/build/native_startup/compiler.txt
            research/boot_reconstruction/build/native_startup/linker.txt
            research/boot_reconstruction/examples/native_startup/README_RU.md
      - name: Build NGame probe and verify native binding in public ARM VM
        run: make -C research/boot_reconstruction arm-native-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save experimental RAM application and source-built ELF
        uses: actions/upload-artifact@v4
        with:
          name: native-probe-ngame-vm-tested
          retention-days: 14
          path: |
            research/boot_reconstruction/build/native_startup/SPMP_PROBE_VM.bin
            research/boot_reconstruction/build/native_startup/native.elf
            research/boot_reconstruction/build/native_startup/native.map
            research/boot_reconstruction/build/native_startup/native_layout.json
            research/boot_reconstruction/build/native_startup/native_package.json
            research/boot_reconstruction/build/native_startup/native_binding_vm.json
            research/boot_reconstruction/examples/native_startup/NGAME_README_RU.md
      - name: Build interactive input logger and run ARM/virtual-SD checks
        run: make -C research/boot_reconstruction arm-input-check ARM_VM_PYTHON=/tmp/spmp-startup-vm/bin/python
      - name: Save input test NGame and log decoder
        uses: actions/upload-artifact@v4
        with:
          name: spmp-input-sd0-vm-tested
          retention-days: 14
          path: |
            research/boot_reconstruction/build/input_test/SPMP_INPUT_SD0.bin
            research/boot_reconstruction/build/input_test/input.elf
            research/boot_reconstruction/build/input_test/input.map
            research/boot_reconstruction/build/input_test/input_package.json
            research/boot_reconstruction/build/input_test/input_vm.json
            research/boot_reconstruction/build/input_test/input_preview.ppm
            research/boot_reconstruction/build/input_test/example.csv
            research/boot_reconstruction/build/input_test/example_decoded.json
            research/boot_reconstruction/examples/input_test/README_RU.md
            research/boot_reconstruction/examples/input_test/preview.png
            research/boot_reconstruction/tools/input_log_decode.py
      - name: File manager component checks
        run: |
          for n in 01 02 03 04 05; do
            (cd project/spmp-os/features/filemanager/FM$n && sh tools/build.sh)
          done
